<style>
  .portal-shell {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--navy-deep, #0B1F3A);
    color: var(--ivory-cream, #F5F1E8);
    padding: clamp(40px, 8vw, 96px) clamp(20px, 4vw, 64px);
  }
  .portal-card {
    max-width: 560px;
    text-align: center;
  }
  .portal-card .eyebrow {
    display: block;
    font-family: var(--ff-body, 'Inter', sans-serif);
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--champagne, #C4A962);
    margin-bottom: 24px;
  }
  .portal-card h1 {
    font-family: var(--ff-display, 'Fraunces', serif);
    font-weight: 400;
    font-size: clamp(36px, 5vw, 64px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0 0 28px;
    font-variation-settings: "opsz" 144;
  }
  .portal-card h1 em {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--champagne, #C4A962);
    font-weight: 400;
  }
  .portal-card p {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(17px, 1.4vw, 22px);
    line-height: 1.5;
    color: var(--ivory-cream, #F5F1E8);
    opacity: 0.78;
    margin: 0 0 36px;
    max-width: 44ch;
    margin-left: auto;
    margin-right: auto;
  }
  .portal-cta {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 16px 32px;
    background: transparent;
    color: var(--ivory-cream);
    border: 1px solid var(--champagne, #C4A962);
    font-family: var(--ff-body, 'Inter', sans-serif);
    font-size: 12px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .portal-cta:hover {
    background: var(--champagne, #C4A962);
    color: var(--navy-deep, #0B1F3A);
  }
  .portal-back {
    margin-top: 48px;
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--champagne, #C4A962);
    opacity: 0.7;
  }
  .portal-back a {
    color: inherit;
    border-bottom: 1px solid currentColor;
    padding-bottom: 2px;
  }
</style>

<body>

<main class="portal-shell">
  <div class="portal-card">
    <span class="eyebrow" data-en="A PRIVATE WORKSPACE" data-es="UN ESPACIO PRIVADO">A PRIVATE WORKSPACE</span>
    <h1>
      <span data-en="The Client" data-es="El">The Client</span>
      <em data-en="Portal." data-es="Portal del Cliente.">Portal.</em>
    </h1>
    <p data-en="Saved listings, tour history, documents, and a direct line to Mirtha — all in one private workspace." data-es="Propiedades guardadas, historial de visitas, documentos y una línea directa con Mirtha — todo en un solo espacio privado.">
      Saved listings, tour history, documents, and a direct line to Mirtha — all in one private workspace.
    </p>
    <a id="portal-link" class="portal-cta" href="https://crm.mirthacarolina.com/portal">
      <span data-en="ENTER PORTAL" data-es="ENTRAR AL PORTAL">ENTER PORTAL</span>
      <svg width="18" height="10" viewBox="0 0 24 12" aria-hidden="true">
        <path d="M0 6 H22 M16 1 L22 6 L16 11" stroke="currentColor" stroke-width="1.2" fill="none" />
      </svg>
    </a>
    <p class="portal-back">
      <a href="/" data-en="← Back to mirthacarolina.com" data-es="← Volver a mirthacarolina.com">← Back to mirthacarolina.com</a>
    </p>
  </div>
</main>

<script>
  // If the build env exposes a custom portal URL via meta tag, use it.
  // Lets us swap CRM URL without rebuilding HTML once the CRM is deployed
  // at a different domain.
  (function () {
    var meta = document.querySelector('meta[name="mc-portal-url"]');
    var url = meta && meta.getAttribute('content');
    if (url) {
      var link = document.getElementById('portal-link');
      if (link) link.setAttribute('href', url);
    }
    // Apply locale on load (mirrors site.js behavior on this standalone page)
    var loc = 'en';
    try { loc = localStorage.getItem('mc-locale') || loc; } catch (e) {}
    document.documentElement.lang = loc;
    document.querySelectorAll('[data-en]').forEach(function (el) {
      var v = el.dataset[loc];
      if (v !== undefined && v !== null) el.textContent = v;
    });
  })();
</script>

</body>
